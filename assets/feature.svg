<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Planner pipeline: build the sheet, compare rolls, save the preset, export the build">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c110d"/><stop offset="1" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="gld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc857"/><stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fbf7d"/><stop offset="1" stop-color="#7ee081"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18" stop-opacity=".7"/><stop offset=".5" stop-color="#ffc857" stop-opacity=".7"/><stop offset="1" stop-color="#7ee081" stop-opacity=".7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="0" fill="url(#bg)"/>
  <g opacity=".07" stroke="#7ee081" stroke-width="1"><path d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M0 600 H1200"/></g>
  <text x="600" y="78" font-family="Chakra Petch, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#9dab9f" text-anchor="middle">THE PLANNER PIPELINE</text>
  <line x1="200" y1="340" x2="1000" y2="340" stroke="url(#dash)" stroke-width="3" stroke-dasharray="14 16" stroke-linecap="round"/>
  <!-- stage 1 -->
  <g transform="translate(200 340)">
    <circle r="70" fill="radial-gradient(circle at 30% 25%, #2b2015, #151109)" stroke="rgba(255,122,24,.4)" stroke-width="2"/>
    <circle r="70" fill="#151109" stroke="url(#ac)" stroke-width="2.5" opacity=".0"/>
    <circle r="70" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <text y="6" font-family="Chakra Petch, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffd9b8" text-anchor="middle">01</text>
    <text y="116" font-family="Chakra Petch, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ec" text-anchor="middle">BUILD</text>
    <text y="148" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">Add gear and weapons</text>
    <text y="168" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">to a fresh sheet</text>
  </g>
  <!-- stage 2 -->
  <g transform="translate(467 340)">
    <circle r="70" fill="none" stroke="url(#gld)" stroke-width="2.5"/>
    <circle r="70" fill="#151208"/>
    <circle r="70" fill="none" stroke="url(#gld)" stroke-width="2.5"/>
    <text y="6" font-family="Chakra Petch, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffe2a6" text-anchor="middle">02</text>
    <text y="116" font-family="Chakra Petch, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ec" text-anchor="middle">COMPARE</text>
    <text y="148" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">Check rolls, talents</text>
    <text y="168" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">and damage</text>
  </g>
  <!-- stage 3 -->
  <g transform="translate(734 340)">
    <circle r="70" fill="#0f150f"/>
    <circle r="70" fill="none" stroke="url(#grn)" stroke-width="2.5"/>
    <text y="6" font-family="Chakra Petch, Arial, sans-serif" font-size="32" font-weight="700" fill="#c5f5c6" text-anchor="middle">03</text>
    <text y="116" font-family="Chakra Petch, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ec" text-anchor="middle">SAVE</text>
    <text y="148" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">Store as a preset</text>
    <text y="168" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">in your library</text>
  </g>
  <!-- stage 4 -->
  <g transform="translate(1000 340)">
    <circle r="70" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <circle r="70" fill="#151109"/>
    <circle r="70" fill="none" stroke="url(#ac)" stroke-width="2.5"/>
    <text y="6" font-family="Chakra Petch, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffd9b8" text-anchor="middle">04</text>
    <text y="116" font-family="Chakra Petch, Arial, sans-serif" font-size="22" font-weight="700" fill="#eef5ec" text-anchor="middle">EXPORT</text>
    <text y="148" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">Copy as text or</text>
    <text y="168" font-family="Rubik, Arial, sans-serif" font-size="14" fill="#9dab9f" text-anchor="middle">a compact file</text>
  </g>
  <text x="600" y="620" font-family="Rubik, Arial, sans-serif" font-size="15" fill="#7f8d80" text-anchor="middle">Four steps from idea to loadout — local, offline, no account.</text>
</svg>